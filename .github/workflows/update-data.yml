name: Update pharmacy data

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-pharmacy-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scrape fresh data into the working tree, then build and deploy from it.
      # The scraped JSON is never committed — the daily refresh produces no
      # commits on main, mirroring how the gleam version deployed straight to
      # gh-pages. src/data/*.json in the repo is only a build-time baseline.
      - name: Scrape pharmacy data
        run: npm run scrape -- antalya

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # Call wrangler directly rather than via cloudflare/wrangler-action.
        # The action runs `npm i wrangler` inside the repo, which triggers npm's
        # full-tree resolution and can disturb the project's installed deps.
        # `npx --yes` fetches wrangler into an isolated cache and runs it, never
        # touching the project tree. wrangler reads the token/account from env.
        run: npx --yes wrangler@4 pages deploy dist --project-name=eczane --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
